<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smart Incentive Calculator v4.2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
margin:0;
padding:30px;
color:#1b2a3a;
}

.container{
max-width:1100px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

h1{
margin-top:0;
color:#0A7E8C;
}

.section{
margin-top:25px;
padding-top:20px;
border-top:1px solid #e6e6e6;
}

label{
display:block;
font-weight:bold;
margin-top:12px;
}

select,input{
width:100%;
padding:8px;
margin-top:4px;
}

button{
margin-top:15px;
padding:10px 20px;
background:#0A7E8C;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button.secondary{
background:#eee;
color:#333;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
text-align:left;
}

th{
background:#0A7E8C;
color:white;
}

.badge{
display:inline-block;
padding:4px 10px;
border-radius:10px;
background:#ffeeba;
color:#856404;
font-size:12px;
}

.chart-box{
margin-top:25px;
}

.warning{
margin-top:10px;
padding:10px;
background:#fff3cd;
border:1px solid #ffeeba;
border-radius:6px;
}

</style>
</head>

<body>

<div class="container">

<h1>Smart Incentive Calculator v4.2</h1>

<div class="section">

<label>Excel File</label>
<input type="file" id="fileInput">

<label>Period Type</label>
<select id="periodType">
<option value="monthly">Monthly</option>
<option value="quarterly">Quarterly</option>
<option value="yearly">Yearly</option>
<option value="overall">Overall</option>
</select>

<label>Month</label>
<select id="month">
<option>Jan</option>
<option>Feb</option>
<option>Mar</option>
<option>Apr</option>
<option>May</option>
<option>Jun</option>
<option>Jul</option>
<option>Aug</option>
<option>Sep</option>
<option>Oct</option>
<option>Nov</option>
<option>Dec</option>
</select>

<label>Year</label>
<input id="year" type="number" value="2026">

<label>Total Target Override (AED)</label>
<input id="overrideTarget" type="number">

<button onclick="processFile()">Process</button>

</div>

<div id="sheetInfo"></div>

<div id="tableContainer"></div>

<div class="chart-box">
<canvas id="leaderChart"></canvas>
</div>

<div class="chart-box">
<canvas id="trendChart"></canvas>
</div>

<button class="secondary" onclick="exportCSV()">Export CSV</button>

</div>

<script>

let staffData=[]
let monthlyHistory={}
let workbook

function processFile(){

const file=document.getElementById("fileInput").files[0]

if(!file){
alert("Upload Excel file")
return
}

const reader=new FileReader()

reader.onload=e=>{

workbook=XLSX.read(new Uint8Array(e.target.result),{type:"array"})

const period=document.getElementById("periodType").value

const month=document.getElementById("month").value
const year=document.getElementById("year").value

let sheetsUsed=[]

if(period==="monthly"){

const name=findSheet(month,year)

if(!name){
warn("Sheet not found")
return
}

sheetsUsed=[name]

}

if(period==="quarterly"){

const q=getQuarter(month)

const months=qMonths(q)

months.forEach(m=>{
const s=findSheet(m,year)
if(s) sheetsUsed.push(s)
})

}

if(period==="yearly"){

["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
.forEach(m=>{
const s=findSheet(m,year)
if(s) sheetsUsed.push(s)
})

}

if(period==="overall"){

workbook.SheetNames.forEach(s=>{
if(/\d\d/.test(s)) sheetsUsed.push(s)
})

}

aggregateSheets(sheetsUsed)

showSheets(sheetsUsed)

renderTable()

renderLeaderboard()

renderTrend()

}

reader.readAsArrayBuffer(file)

}

function findSheet(m,y){

const yy=y.toString().slice(-2)

return workbook.SheetNames.find(s=>{

const n=s.toLowerCase()

return n.includes(m.toLowerCase()) && n.includes(yy)

})

}

function aggregateSheets(list){

staffData=[]
monthlyHistory={}

list.forEach(sheetName=>{

const sheet=workbook.Sheets[sheetName]

const rows=XLSX.utils.sheet_to_json(sheet,{header:1})

for(let i=0;i<rows.length;i++){

const r=rows[i]

if(!r[0]) continue

if(r[0].toString().toLowerCase()==="staff"){

const name=rows[i+1][0]

const packages=Number(rows[i+1][1]||0)

const sales=Number(rows[i+2][1]||0)

let staff=staffData.find(s=>s.name===name)

if(!staff){

staff={
name,
packages:0,
sales:0
}

staffData.push(staff)

}

staff.packages+=packages
staff.sales+=sales

if(!monthlyHistory[name]) monthlyHistory[name]=[]

monthlyHistory[name].push(sales)

}

}

})

rankStaff()

}

function rankStaff(){

staffData.sort((a,b)=>{

if(b.sales!==a.sales) return b.sales-a.sales
if(b.packages!==a.packages) return b.packages-a.packages
return 0

})

}

function renderTable(){

let html="<table><tr><th>Rank</th><th>Name</th><th>Packages</th><th>Sales</th></tr>"

staffData.forEach((s,i)=>{

html+=`<tr>
<td>${i+1}</td>
<td>${s.name}</td>
<td>${s.packages}</td>
<td>${s.sales.toFixed(2)}</td>
</tr>`

})

html+="</table>"

document.getElementById("tableContainer").innerHTML=html

}

function renderLeaderboard(){

const ctx=document.getElementById("leaderChart")

new Chart(ctx,{
type:"bar",
data:{
labels:staffData.map(s=>s.name),
datasets:[{
label:"Sales",
data:staffData.map(s=>s.sales)
}]
}
})

}

function renderTrend(){

const staff=staffData[0]

if(!staff) return

const hist=monthlyHistory[staff.name]

const ctx=document.getElementById("trendChart")

new Chart(ctx,{
type:"line",
data:{
labels:hist.map((_,i)=>"M"+(i+1)),
datasets:[{
label:staff.name+" sales",
data:hist
}]
}
})

}

function showSheets(list){

document.getElementById("sheetInfo").innerHTML=
"<div class='warning'>Sheets used: "+list.join(", ")+"</div>"

}

function warn(msg){

document.getElementById("sheetInfo").innerHTML=
"<div class='warning'>"+msg+"</div>"

}

function getQuarter(m){

const map={
Jan:1,Feb:1,Mar:1,
Apr:2,May:2,Jun:2,
Jul:3,Aug:3,Sep:3,
Oct:4,Nov:4,Dec:4
}

return map[m]

}

function qMonths(q){

if(q===1) return["Jan","Feb","Mar"]
if(q===2) return["Apr","May","Jun"]
if(q===3) return["Jul","Aug","Sep"]
return["Oct","Nov","Dec"]

}

function exportCSV(){

let csv="Rank,Name,Packages,Sales\n"

staffData.forEach((s,i)=>{
csv+=`${i+1},${s.name},${s.packages},${s.sales}\n`
})

const blob=new Blob([csv],{type:"text/csv"})

const a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download="sales_report.csv"
a.click()

}

</script>

</body>
</html>
