<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Incentive Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f4f6f9;
  --card:#ffffff;
  --text:#1e293b;
  --accent:#0f172a;
  --border:#e2e8f0;
  --equal:#0b3d91;
  --personal:#5c4033;
  --total:#006c6c;
}

html.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#f1f5f9;
  --accent:#38bdf8;
  --border:#334155;
  --equal:#60a5fa;
  --personal:#d4a373;
  --total:#4ade80;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  margin:0;
  padding:20px;
  transition:0.3s ease;
}

.container{
  max-width:900px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:10px;
}

.version{
  font-size:12px;
  opacity:0.7;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.dark-toggle{
  cursor:pointer;
  font-size:18px;
  background:none;
  border:none;
}

.card{
  background:var(--card);
  padding:25px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  border:1px solid var(--border);
  transition:0.3s ease;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0 15px 0;
  border-radius:8px;
  border:1px solid var(--border);
  font-family:'DM Sans',sans-serif;
}

button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:var(--accent);
  color:white;
  font-weight:600;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

.result{
  margin-top:25px;
  line-height:1.8;
}

.equal{
  color:var(--equal);
  font-weight:700;
}

.personal{
  color:var(--personal);
  font-weight:700;
}

.total{
  color:var(--total);
  font-weight:700;
  font-size:18px;
}

.projection{
  font-size:13px;
  color:gray;
  font-style:italic;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>Smart Incentive Calculator</h2>
  </div>

  <div class="topbar">
    <div class="version">v2.4</div>
    <button class="dark-toggle" id="darkToggle">☀️</button>
  </div>

  <div class="card">

    <label>Sales Target</label>
    <input type="number" id="target">

    <label>Total Sales (Team)</label>
    <input type="number" id="totalSales">

    <label>Your Personal Sales</label>
    <input type="number" id="personalSales">

    <label>Number of Salespersons</label>
    <input type="number" id="numPeople" value="25">

    <button onclick="calculate()">Calculate</button>

    <div class="result" id="result"></div>

  </div>

</div>

<script>

const darkToggle=document.getElementById('darkToggle');

darkToggle.addEventListener('click',()=>{
  const isDark=document.documentElement.classList.toggle('dark');
  darkToggle.textContent=isDark?'🌙':'☀️';
});

function calculate(){

  const target=parseFloat(document.getElementById('target').value)||0;
  const totalSales=parseFloat(document.getElementById('totalSales').value)||0;
  const personalSales=parseFloat(document.getElementById('personalSales').value)||0;
  const numPeople=parseInt(document.getElementById('numPeople').value)||1;

  if(target===0||totalSales===0||personalSales===0){
    document.getElementById('result').innerHTML="Enter valid numbers.";
    return;
  }

  const achievement=(totalSales/target)*100;

  let tierPercent=0;
  let tierName="No Tier";

  if(achievement>=85&&achievement<=100){
    tierPercent=0.025;
    tierName="Tier 1 (2.5%)";
  }else if(achievement>=101&&achievement<=110){
    tierPercent=0.03;
    tierName="Tier 2 (3%)";
  }else if(achievement>=111){
    tierPercent=0.035;
    tierName="Tier 3 (3.5%)";
  }

  const totalPool=totalSales*tierPercent;
  const equalSplit=(totalPool*0.7)/numPeople;
  const personalPercent=(personalSales/totalSales);
  const personal30=totalPool*0.3*personalPercent;
  const totalIncentive=equalSplit+personal30;

  const packageValue=1695;
  const newTotal=totalSales+packageValue;
  const newPersonal=personalSales+packageValue;

  const newPool=newTotal*tierPercent;
  const newEqual=(newPool*0.7)/numPeople;
  const newPersonal30=newPool*0.3*(newPersonal/newTotal);
  const projected=newEqual+newPersonal30;

  const difference=projected-totalIncentive;

  document.getElementById('result').innerHTML=`
    <div>Incentive Tier: ${tierName}</div>
    <div>Equal Split (70%): <span class="equal">${equalSplit.toFixed(3)}</span></div>
    <div>Personal Sales %: ${(personalPercent*100).toFixed(3)}%</div>
    <div>Personal 30%: <span class="personal">${personal30.toFixed(3)}</span></div>
    <div>Total Incentive: <span class="total">${totalIncentive.toFixed(2)}</span></div>

    <div class="projection">
      If you had sold an additional 1695 AED package, your incentive would be ${projected.toFixed(2)} AED.  
      Difference: +${difference.toFixed(2)} AED.
    </div>
  `;
}

</script>

</body>
</html>
