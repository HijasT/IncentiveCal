<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Incentive Calculator</title>

<style>
body{
  font-family: Inter, Arial;
  background:#0f172a;
  color:#e5e7eb;
  margin:0;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

h1{
  font-size:22px;
  margin-bottom:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:8px;
  margin-top:5px;
  border-radius:6px;
  border:none;
  background:#0f172a;
  color:#fff;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  margin-top:10px;
}

button:hover{
  background:#1d4ed8;
}

.row{
  display:flex;
  gap:10px;
}

.row input{
  flex:1;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th, td{
  padding:8px;
  border-bottom:1px solid #334155;
}

th{
  text-align:left;
}

.footer{
  margin-top:30px;
  text-align:center;
  font-size:11px;
  color:#64748b;
}
</style>
</head>

<body>

<div class="container">

<h1>Smart Incentive Calculator</h1>

<div class="card">
<label>Monthly Target</label>
<input id="target" type="number" placeholder="Enter target">
</div>

<div class="card">
<h3>Staff</h3>
<div id="staffContainer"></div>
<button onclick="addStaff()">+ Add Staff</button>
</div>

<div class="card">
<button onclick="calculate()">Calculate Incentives</button>
<div id="summary"></div>
<div id="result"></div>
</div>

<div class="footer">
© 2026 HT • Smart Incentive Calculator • Proprietary Software
</div>

</div>

<script>
let staffList = [];

function addStaff(){
  const id = Date.now();
  staffList.push({ id, name:"", revenue:0 });
  renderStaff();
}

function renderStaff(){
  const container = document.getElementById("staffContainer");
  container.innerHTML = "";

  staffList.forEach(p => {
    container.innerHTML += `
      <div class="row">
        <input placeholder="Name" onchange="updateName(${p.id}, this.value)">
        <input type="number" placeholder="Revenue" onchange="updateRevenue(${p.id}, this.value)">
      </div>
    `;
  });
}

function updateName(id, val){
  const p = staffList.find(x=>x.id===id);
  if(p) p.name = val;
}

function updateRevenue(id, val){
  const p = staffList.find(x=>x.id===id);
  if(p) p.revenue = Number(val)||0;
}

function getRate(a){
  if (a >= 111) return 0.035;
  if (a >= 101) return 0.03;
  if (a >= 85) return 0.025;
  if (a >= 75) return 0.015;
  return 0;
}

function calculate(){

  const target = Number(document.getElementById("target").value);

  if(!target || target<=0){
    alert("Enter valid target");
    return;
  }

  const totalRevenue = staffList.reduce((s,p)=>s+p.revenue,0);
  const achievement = totalRevenue ? (totalRevenue/target)*100 : 0;
  const rate = getRate(achievement);

  const totalIncentive = totalRevenue * rate;

  const P1 = totalIncentive * 0.6;
  const P2 = totalIncentive * 0.4;

  const staffCount = staffList.length;
  const P1_each = staffCount ? P1 / staffCount : 0;

  // Summary
  document.getElementById("summary").innerHTML = `
    <p>Achievement: ${achievement.toFixed(2)}%</p>
    <p>Rate: ${(rate*100).toFixed(2)}%</p>
    <p>Total Incentive: ${totalIncentive.toFixed(2)}</p>
  `;

  let html = `
  <table>
    <tr>
      <th>Name</th>
      <th>Revenue</th>
      <th>P1</th>
      <th>P2</th>
      <th>Total</th>
    </tr>
  `;

  staffList.forEach(p=>{
    const contribution = totalRevenue ? p.revenue/totalRevenue : 0;
    const p2 = P2 * contribution;
    const total = P1_each + p2;

    html += `
      <tr>
        <td>${p.name || "-"}</td>
        <td>${p.revenue.toFixed(2)}</td>
        <td>${P1_each.toFixed(2)}</td>
        <td>${p2.toFixed(2)}</td>
        <td>${total.toFixed(2)}</td>
      </tr>
    `;
  });

  html += `</table>`;

  document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
